name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

      - name: Build binaries
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*} arch=${t#*/} ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/resumeproxy-$os-$arch$ext" .
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

      - uses: ko-build/setup-ko@v0.9 # logs in to ghcr.io and sets KO_DOCKER_REPO=ghcr.io/<owner>/<repo>
      - name: Build and push image
        run: |
          ko build --bare --platform=linux/amd64,linux/arm64 \
            --tags "${GITHUB_REF_NAME#v},latest" \
            --image-label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} .
